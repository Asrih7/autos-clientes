<div class="position-relative w-full h-full mt-large">
	@if (errorMsg()) {
		<div class="flex justify-content-center w-full mb-medium">
			<span class="text-hint text-medium font-weight-bold text-danger">
				{{ errorMsg() }}
			</span>
		</div>
	}

	@if (aseguradorasGrid().length > 0) {
		<lib-grid-tarjetas
			[elementos]="aseguradorasGrid()"
			[idSeleccionado]="aseguradoraSeleccionada()?.id"
			(elementoClick)="onCardClick($event)"
		></lib-grid-tarjetas>
	}

	@if (aseguradorasSelect().length > 0) {
	<div class="flex flex-direction-column w-full background-grey-light p-large border-radius-normal mt-medium">
		<span class="text-medium font-weight-bold text-primary-dark mb-x-small">¿No encuentras tu compañía?</span>

		<bal-select
			placeholder="Selecciona tu aseguradora"
			[value]="aseguradoraSeleccionada()?.id ?? ''"
			(balChange)="onSelectUpdate($event)"
			typeahead="true"
		>
			@for (aseguradora of aseguradorasSelect(); track aseguradora.id) {
				<bal-select-option [value]="aseguradora.id" [label]="aseguradora.nombre">
					{{ aseguradora.nombre }}
				</bal-select-option>
			}
		</bal-select>
	</div>
	}
</div>
