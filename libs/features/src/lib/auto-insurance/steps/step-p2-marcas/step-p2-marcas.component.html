<div class="position-relative w-full h-full mt-large" *transloco="let t; prefix: 'tarificacion.step2'">

	@if (errorMsg()) {
		<div class="flex justify-content-center w-full mb-medium">
			<span class="text-hint text-medium font-weight-bold text-danger">
				{{ errorMsg() }}
			</span>
		</div>
	}
	@if (marcasGrid().length > 0) {
		<lib-grid-tarjetas
			[elementos]="marcasGrid()"
			[idSeleccionado]="marcaSeleccionada()?.id"
			(elementoClick)="onCardClick($event)"
		>
		</lib-grid-tarjetas>
	}
	<div class="flex flex-direction-column w-full background-grey-light p-large border-radius-normal mt-medium">
		<span class="text-medium font-weight-bold text-primary-dark mb-x-small">{{ t('label_otras_marcas') }}</span>

		<bal-select
			placeholder="{{ t('placeholder_select') }}"
			[value]="marcaSeleccionada()?.id ?? ''"
			(balChange)="onSelectUpdate($event)"
			typeahead="true"
		>
			@for (marca of marcasSelect(); track marca.id) {
				<bal-select-option [value]="marca.id" [label]="marca.nombre">
					{{ marca.nombre }}
				</bal-select-option>
			}
		</bal-select>
	</div>
</div>
