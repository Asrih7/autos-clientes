<h3 class="bal-heading my-normal">{{'tarificacion.step5.titulo_combustible' | transloco}}</h3>
<div class="grid">
    @for (fuel of fuels(); track $index) {
    <div class="col is-one-fifth">
        <button class="button is-secondary w-full h-5rem" [class.is-active]="selectedFuelId() === fuel.id"
            (click)="onClick(fuel.id, 'fuel')">{{ fuel.nombre }}</button>
    </div>
    }
</div>

<h3 class="bal-heading my-normal">{{'tarificacion.step5.titulo_puertas' | transloco}}</h3>
<div class="grid">
    @for (door of doors(); track $index) {
    <div class="col is-one-fifth">
        <button class="button is-secondary w-full h-5rem" [class.is-active]="selectedDoorId() === door.id"
            (click)="onClick(door.id, 'door')">{{ door.nombre }}</button>
    </div>
    }
</div>

<h3 class="bal-heading my-normal">{{'tarificacion.step5.titulo_asientos' | transloco}}</h3>
<div class="grid">
    @for (seat of seats(); track $index) {
    <div class="col is-one-fifth">
        <button class="button is-secondary w-full h-5rem" [class.is-active]="selectedSeatId() === seat.id"
            (click)="onClick(seat.id, 'seat')">{{ seat.nombre }}</button>
    </div>
    }
</div>

<bal-button color="primary" [disabled]="!this.navigation.canGoForward()"
    (click)="this.navigation.next()">Siguiente</bal-button>
