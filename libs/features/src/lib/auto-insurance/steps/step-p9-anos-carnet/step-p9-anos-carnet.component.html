<div class="flex flex-direction-column align-items-center justify-content-center w-full py-xx-large gap-large" *transloco="let t">
	<div class="flex align-items-center justify-content-center gap-large w-6">
		<bal-button color="info" square="true" (click)="disminuirEdad()">-</bal-button>
		<bal-input
			type="number"
			[value]="edadCarnet()"
			(balInput)="onAgeInput($event)"
		></bal-input>
		<bal-button color="info" square="true" (click)="aumentarEdad()">+</bal-button>
	</div>

	@if (showError() && errorMessage()) {
		<span class="text-hint text-small font-weight-bold color-danger">{{ t(errorMessage()!) }}</span>
	}

	<bal-button color="primary" (click)="avanzar()">{{ t('tarificacion.forms.next') }}</bal-button>
</div>
