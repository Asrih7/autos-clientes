<div
	class="flex flex-direction-column align-items-center w-full py-xx-large"
	*transloco="let t; prefix: 'tarificacion.p14'"
>
	<div class="flex flex-direction-column mobile:w-full tablet:w-8 desktop:w-6 gap-normal">
		<lib-datos-persona
			[datos]="datos()"
			[camposVisibles]="camposVisibles"
			[mostrarErrores]="mostrarErrores()"
			(datosChange)="actualizarDatos($event)"
			(validezChange)="formularioValido.set($event)"
		></lib-datos-persona>

		<div class="flex justify-content-center mt-large">
			<bal-button color="primary" (click)="avanzar()">{{ t('next') }}</bal-button>
		</div>
	</div>
</div>
