<section class="flex flex-direction-column w-full px-xx-large py-x-large" *transloco="let t; prefix: 'tarificacion.p24'">
	<div class="flex flex-direction-column align-items-center text-center mb-xx-large">
		<bal-heading level="h1" space="none" class="title text-xx-large">{{ t('title') }}</bal-heading>
		<p class="text-large m-0 mt-small">{{ t('subtitle') }}</p>
	</div>

	<lib-vehicle-price-summary
		class="mb-x-large"
		[vehicleTitle]="tituloVehiculo()"
		[vehicleDetail]="detalleVehiculo()"
		[registrationLabel]="t('registration')"
		[registration]="state.formData().matricula ?? ''"
		[modality]="modalidad()?.agrupacion?.descripcion ?? t('modality')"
		[amount]="modalidad()?.primaTotal ?? 0"
	></lib-vehicle-price-summary>

	<div class="flex align-items-center w-full border-bottom-grey pb-normal mb-x-large">
		<bal-button square="true" color="info" icon="nav-go-left" (click)="volver()"></bal-button>
		<div class="flex align-items-center ml-normal">
			<bal-icon id="p24-tooltip" name="info-circle" size="medium"></bal-icon>
			<bal-tooltip reference="p24-tooltip">{{ t('tooltip') }}</bal-tooltip>
		</div>
		<bal-button class="ml-auto" square="true" color="info" icon="nav-go-right" [disabled]="respuestaSeleccionada() === null" (click)="continuar()"></bal-button>
	</div>

	<div class="flex justify-content-center gap-normal w-full mb-x-large">
		<bal-button class="w-20rem" [expanded]="true" [color]="respuestaSeleccionada() === false ? 'primary' : 'info'" [outlined]="respuestaSeleccionada() !== false" (click)="seleccionarRespuesta(false)">{{ t('no') }}</bal-button>
		<bal-button class="w-20rem" [expanded]="true" [color]="respuestaSeleccionada() === true ? 'primary' : 'info'" [outlined]="respuestaSeleccionada() !== true" (click)="seleccionarRespuesta(true)">{{ t('yes') }}</bal-button>
	</div>

	<div class="flex justify-content-center">
		<bal-button color="primary" [disabled]="respuestaSeleccionada() === null" (click)="continuar()">{{ t('next') }}</bal-button>
	</div>
</section>
