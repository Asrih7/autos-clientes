<div class="flex flex-direction-column align-items-center justify-content-center w-full py-xx-large gap-large" *transloco="let t">
	<div class="flex justify-content-center w-6 gap-none">
		<div class="flex flex-direction-column w-full">
			<span class="text-small text-grey mb-xx-small">{{ t('tarificacion.forms.birthDate.day') }}</span>
			<bal-input
				type="number"
				placeholder="DD"
				[value]="day()"
				(balInput)="onDayInput($event)"
			></bal-input>
		</div>
		<div class="flex flex-direction-column w-full">
			<span class="text-small text-grey mb-xx-small">{{ t('tarificacion.forms.birthDate.month') }}</span>
			<bal-input
				type="number"
				placeholder="MM"
				[value]="month()"
				(balInput)="onMonthInput($event)"
			></bal-input>
		</div>
		<div class="flex flex-direction-column w-full">
			<span class="text-small text-grey mb-xx-small">{{ t('tarificacion.forms.birthDate.year') }}</span>
			<bal-input
				type="number"
				placeholder="AAAA"
				[value]="year()"
				(balInput)="onYearInput($event)"
			></bal-input>
		</div>
	</div>

	@if (showError() && errorMessage()) {
		<span class="text-hint text-small font-weight-bold color-danger">{{ t(errorMessage()!) }}</span>
	}

</div>
