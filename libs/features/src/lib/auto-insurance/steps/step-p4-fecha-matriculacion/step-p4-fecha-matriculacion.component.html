<div class="flex align-items-center flex-direction-column">
    <div class="flex w-full gap-large py-xx-large px-xxxx-large">
        <bal-dropdown placeholder="Mes" [value]="selectedMonth()" (balChange)="onChangeMonth($event)">
            @for (month of _months; track $index) {
            <bal-option [value]="$index + 1" [label]="month">
                {{ month }}
            </bal-option>
            }
        </bal-dropdown>

        <bal-dropdown placeholder="Año" [value]="selectedYear()" (balChange)="onChangeYear($event)">
            @for (year of _years; track year) {
            <bal-option [value]="year" [label]="year.toString()">
                {{ year }}
            </bal-option>
            }
        </bal-dropdown>
    </div>
    <bal-button color="primary" (click)="avanzar()">Siguiente</bal-button>
</div>
