<div class="position-relative w-full h-full mt-large">
	<lib-grid-tarjetas
		[elementos]="years()"
		[idSeleccionado]="selectedYear()"
		(elementoClick)="onCardClick($event)"
	></lib-grid-tarjetas>
	@if (yearsSelect().length) {
		<bal-select
			placeholder="Selecciona un año"
			[value]="selectedYear() ?? ''"
			(balChange)="onSelectUpdate($event)"
		>
			@for (year of yearsSelect(); track year.id) {
				<bal-select-option [value]="year.id" [label]="year.nombre">{{ year.nombre }}</bal-select-option>
			}
		</bal-select>
	}
</div>
