<div class="flex flex-direction-column align-items-center justify-content-center w-full py-xx-large gap-large" *transloco="let t">
	<div class="flex justify-content-center gap-normal w-6">
		<bal-button
			[expanded]="true"
			[color]="respuestaSeleccionada() === true ? 'primary' : 'info'"
			[outlined]="respuestaSeleccionada() !== true"
			(click)="seleccionarRespuesta(true)"
		>
			{{ t('tarificacion.forms.insurance.yes') }}
		</bal-button>

		<bal-button
			[expanded]="true"
			[color]="respuestaSeleccionada() === false ? 'primary' : 'info'"
			[outlined]="respuestaSeleccionada() !== false"
			(click)="seleccionarRespuesta(false)"
		>
			{{ t('tarificacion.forms.insurance.no') }}
		</bal-button>
	</div>

</div>
