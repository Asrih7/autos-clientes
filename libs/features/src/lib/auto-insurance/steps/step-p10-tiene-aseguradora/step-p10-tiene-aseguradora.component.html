<h3 class="bal-heading">P10 - Seguro Actual</h3>
<p class="bal-text bal-margin-bottom-normal">¿Tiene el vehículo un seguro en vigor con otra compañía actualmente?</p>

<div class="bal-flex bal-flex-gap-normal" style="display: flex; gap: 1rem;">
  
  <bal-button color="primary" (click)="responderSi()">
    Sí, tengo seguro
  </bal-button>

  <bal-button color="secondary" (click)="responderNo()">
    No, es un coche nuevo / no asegurado
  </bal-button>

</div>
