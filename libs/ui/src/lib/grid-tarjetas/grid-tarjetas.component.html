<div class="grid is-multiline mb-large">
	@for (item of elementos(); track item.id) {
		<div class="col mobile:is-12 tablet:is-4 desktop:is-one-fifth flex justify-content-center">
			<bal-card
				clickable="true"
				[class.bg-primary-1]="idSeleccionado() === item.id"
				[class.border-primary-light]="idSeleccionado() === item.id"
				class="w-full flex flex-direction-column align-items-center justify-content-center p-normal h-8rem"
				(click)="onCardClick(item)"
			>
				<bal-card-content class="flex flex-direction-column align-items-center justify-content-center gap-small">
					<img [src]="item.logoUrl" [alt]="item.nombre" class="h-3rem" style="object-fit: contain" />
					<span class="text-small font-weight-bold color-blue-dark text-uppercase mt-small">
						{{ item.nombre }}
					</span>
				</bal-card-content>
			</bal-card>
		</div>
	}
</div>
